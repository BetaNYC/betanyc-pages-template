<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social card</title>
<!-- Open this file at exactly 1200 x 630 and take a screenshot to make og-image.png.
     Edit the text below; keep it short enough to read on a phone. -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #414141; background: #eef4ff; display: flex; flex-direction: column; }
  .bar { background: #2359a8; height: 96px; display: flex; align-items: center; padding: 0 64px; }
  .bar img { height: 46px; }
  .body { flex: 1; padding: 48px 64px 0; display: flex; flex-direction: column; }
  .tag { font-size: 22px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #2359a8; }
  h1 { font-size: 64px; line-height: 1.08; color: #2359a8; margin: 14px 0 18px; max-width: 1040px; }
  p { font-size: 30px; line-height: 1.35; margin: 0; max-width: 1000px; }
  .url { margin-top: auto; padding-bottom: 40px; font-size: 24px; font-weight: 700; color: #2359a8; }
</style>
</head>
<body>
  <div class="bar"><img src="betanyc-wordmark-white.svg" alt="BetaNYC"></div>
  <div class="body">
    <div class="tag">BetaNYC · open data</div>
    <h1>Say what this is in one line</h1>
    <p>One sentence on why it matters.</p>
    <div class="url">betanyc.github.io/REPO</div>
  </div>
</body>
</html>
